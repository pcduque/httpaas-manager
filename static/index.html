<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HTTPaaS Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 20px;
            color: #222;
        }
        h1, h2 { color: #222; }
        .card {
            background: white;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,.1);
        }
        input, button { padding: 8px; margin: 5px; font-size: 14px; }
        button {
            background: #0b65c2;
            color: white;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        pre {
            background: #111;
            color: #00ff66;
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-x: auto;
            min-height: 60px;
            font-family: Consolas, "Courier New", monospace;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f2f5; }
        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-running { background: #d4edda; color: #155724; }
        .badge-stopped { background: #f8d7da; color: #721c24; }
        .badge-starting { background: #fff3cd; color: #856404; }
        .badge-stopping { background: #fff3cd; color: #856404; }
        button.danger { background: #c0392b; }
        button.warn { background: #d68910; }
        button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>

<h1>HTTPaaS Manager</h1>

<div class="card">
    <h2>Publicar nueva pagina o aplicacion web</h2>
    <input id="host_name" placeholder="ej: paisaje">
    <input id="site_zip" type="file" accept=".zip">
    <button onclick="createInstance()">Publicar</button>
    <pre id="create_result"></pre>
</div>

<div class="card">
    <h2>Instancias aprovisionadas</h2>
    <button onclick="loadInstances()">Recargar</button>
    <div id="instances_table"></div>
    <pre id="action_result"></pre>
</div>

<script>
function show(id, data) {
    const el = document.getElementById(id);
    el.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
}

async function createInstance() {
    const hostName = document.getElementById('host_name').value.trim();
    const fileInput = document.getElementById('site_zip');
    if (!hostName) { alert('Debe ingresar un nombre de host'); return; }
    if (!fileInput.files.length) { alert('Debe seleccionar un archivo .zip'); return; }

    const formData = new FormData();
    formData.append('host_name', hostName);
    formData.append('site_zip', fileInput.files[0]);

    if (createResultTimer) { clearTimeout(createResultTimer); createResultTimer = null; }
    show('create_result', 'Provisionando ' + hostName + '...');
    try {
        const res = await fetch('/instances', { method: 'POST', body: formData });
        const data = await res.json();
        show('create_result', data);
        if (res.ok) {
            document.getElementById('host_name').value = '';
            fileInput.value = '';
            createResultTimer = setTimeout(() => {
                show('create_result', '');
                createResultTimer = null;
            }, 5000);
        }
        loadInstances();
    } catch (e) {
        show('create_result', 'Error: ' + e.message);
    }
}

let transientPollTimer = null;
let createResultTimer = null;

function renderInstances(list) {
    const container = document.getElementById('instances_table');
    if (!Array.isArray(list) || list.length === 0) {
        container.innerHTML = '<p>No hay instancias.</p>';
        ensureTransientPoll(list);
        return;
    }
    const rows = list.map(ins => {
        const status = ins.status || 'running';
        let badgeClass = 'badge-stopped';
        if (status === 'running') badgeClass = 'badge-running';
        else if (status === 'starting') badgeClass = 'badge-starting';
        else if (status === 'stopping') badgeClass = 'badge-stopping';
        const isTransient = status === 'starting' || status === 'stopping';
        let label = status;
        if (status === 'starting') label = 'iniciando (puede tardar 2-3 min)';
        else if (status === 'stopping') label = 'deteniendo...';
        const startDisabled = (status === 'running' || isTransient) ? 'disabled' : '';
        const stopDisabled = (status === 'stopped' || isTransient) ? 'disabled' : '';
        const safe = encodeURIComponent(ins.hostname);
        return `<tr>
            <td>${ins.hostname}</td>
            <td>${ins.ip}</td>
            <td>${ins.vm_name}</td>
            <td><span class="badge ${badgeClass}">${label}</span></td>
            <td>
                <button class="warn" ${startDisabled} onclick="startInstance('${safe}')">Activar</button>
                <button class="warn" ${stopDisabled} onclick="stopInstance('${safe}')">Desactivar</button>
                <button class="danger" onclick="deleteInstance('${safe}')">Eliminar</button>
            </td>
        </tr>`;
    }).join('');
    container.innerHTML = `<table>
        <thead><tr><th>Host</th><th>IP</th><th>VM</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>${rows}</tbody>
    </table>`;
    ensureTransientPoll(list);
}

function ensureTransientPoll(list) {
    const hasTransient = Array.isArray(list) && list.some(i => {
        const s = i.status || '';
        return s === 'starting' || s === 'stopping';
    });
    if (hasTransient && !transientPollTimer) {
        transientPollTimer = setInterval(loadInstances, 5000);
    } else if (!hasTransient && transientPollTimer) {
        clearInterval(transientPollTimer);
        transientPollTimer = null;
    }
}

async function loadInstances() {
    try {
        const res = await fetch('/instances');
        const data = await res.json();
        renderInstances(data);
    } catch (e) {
        document.getElementById('instances_table').textContent = 'Error: ' + e.message;
    }
}

async function deleteInstance(hostName) {
    if (!confirm('¿Eliminar la instancia ' + decodeURIComponent(hostName) + '? Esto borra la VM y el registro DNS.')) return;
    show('action_result', 'Eliminando ' + decodeURIComponent(hostName) + '...');
    try {
        const res = await fetch('/instances?host_name=' + hostName, { method: 'DELETE' });
        const data = await res.json();
        show('action_result', data);
        if (res.ok) {
            show('create_result', '');
        }
        loadInstances();
    } catch (e) {
        show('action_result', 'Error: ' + e.message);
    }
}

async function startInstance(hostName) {
    show('action_result', 'Activando ' + decodeURIComponent(hostName) + '...');
    try {
        const res = await fetch('/instances/start?host_name=' + hostName, { method: 'POST' });
        const data = await res.json();
        show('action_result', data);
        loadInstances();
    } catch (e) {
        show('action_result', 'Error: ' + e.message);
    }
}

async function stopInstance(hostName) {
    show('action_result', 'Desactivando ' + decodeURIComponent(hostName) + '...');
    try {
        const res = await fetch('/instances/stop?host_name=' + hostName, { method: 'POST' });
        const data = await res.json();
        show('action_result', data);
        loadInstances();
    } catch (e) {
        show('action_result', 'Error: ' + e.message);
    }
}

loadInstances();
</script>

</body>
</html>
